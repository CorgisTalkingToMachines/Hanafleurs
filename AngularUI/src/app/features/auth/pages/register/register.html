<div class="register-wrapper">
  <form class="form" #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
    <div class="form-group">
      <label for="username">Utilisateur*</label>
      <input type="text" id="username" name="username" [(ngModel)]="user.username">
    </div>

    <div class="form-group">
      <label for="email">Email*</label>
      <input type="email" id="email" name="email" [(ngModel)]="user.email">
    </div>

    <div class="form-group">
      <label for="password">Mot de passe*</label>
      <input type="password" id="password" name="password" [(ngModel)]="user.password">
    </div>

    <button type="submit" [disabled]="registerForm.invalid">Création du compte</button>
  </form>

  <hf-separator></hf-separator>

  <button>Continuer avec Google</button>
</div>
